name: Test

on:
  push:
    branches:
      - main
      - 'build/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: srocial
          POSTGRES_PASSWORD: srocial_test
          POSTGRES_DB: srocial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U srocial -d srocial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgres://srocial:srocial_test@127.0.0.1:5432/srocial_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: find server client tests -name '*.js' -print0 | xargs -0 -n1 node --check
