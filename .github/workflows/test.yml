name: Test

on:
  push:
    branches:
      - main
      - 'build/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: find server client tests -name '*.js' -print0 | xargs -0 -n1 node --check
